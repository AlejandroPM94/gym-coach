services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gym_coach
      POSTGRES_USER: gym_coach
      POSTGRES_PASSWORD: gym_coach
    ports:
      - "5432:5432"
    volumes:
      - gym_coach_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym_coach -d gym_coach"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:0.32.3
    gpus: all
    environment:
      OLLAMA_CONTEXT_LENGTH: "16384"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KEEP_ALIVE: 10m
    ports:
      - "11434:11434"
    volumes:
      - gym_coach_ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  gym_coach_postgres:
  gym_coach_ollama:
